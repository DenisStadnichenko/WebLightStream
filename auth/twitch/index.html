<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to StadFlow...</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .redirect-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="redirect-container">
        <div class="loader"></div>
        <h1>Opening StadFlow...</h1>
        <p class="subtitle">If the app doesn't open automatically, click the button below.</p>

        <a id="manual-link" href="#" class="cta-button">Open App Manually</a>

        <p style="margin-top: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
            Redirecting from Twitch Authentication
        </p>
    </div>
</div>

<script>
    const hash = window.location.hash.substring(1);
    const search = window.location.search.substring(1);
    const params = hash || search;
    const deepLink = "stadflow://auth/twitch?" + params;

    if (params) {
        document.getElementById('manual-link').href = deepLink;
        window.location.href = deepLink;

        // Fallback: try again after a short delay
        setTimeout(() => {
            window.location.href = deepLink;
        }, 2500);
    } else {
        document.querySelector('h1').textContent = "Invalid Authentication";
        document.querySelector('.subtitle').textContent = "No authentication parameters found.";
        document.getElementById('manual-link').style.display = 'none';
        document.querySelector('.loader').style.display = 'none';
    }
</script>

</body>
</html>
