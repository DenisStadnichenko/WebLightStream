<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch Authentication - StadFlow</title>
</head>
<body>
<h1>Authorizing StadFlow...</h1>
<p>You can return to the app if it does not open automatically.</p>

<script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    let deepLink = "stadflow://auth/twitch";

    if (error) {
        deepLink += "?error=" + encodeURIComponent(error);
    } else if (code) {
        deepLink += "?code=" + encodeURIComponent(code);
        if (state) {
            deepLink += "&state=" + encodeURIComponent(state);
        }
    }

    window.location.href = deepLink;
</script>
</body>
</html>
