<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorizing Twitch — StadFlow</title><link rel="stylesheet" href="../../styles.css"></head><body><main class="section wrap cta"><h1>Authorizing Twitch...</h1><p>If StadFlow does not open automatically, use the button below.</p><a id="manual-link" class="btn" href="#">Open StadFlow</a></main><script>const p=location.hash.substring(1)||location.search.substring(1);const link='stadflow://auth/twitch?'+p;document.getElementById('manual-link').href=link;if(p){location.href=link;setTimeout(()=>location.href=link,1800);}</script></body></html>
