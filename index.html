<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch Authentication - StadFlow</title>
</head>
<body>
<h1>Opening StadFlow...</h1>
<p>If nothing happens, return to the app manually.</p>

<script>
    const hash = window.location.hash.substring(1);
    const search = window.location.search.substring(1);
    const params = hash || search;

    if (params) {
        window.location.href = "stadflow://auth/twitch?" + params;
    }
</script>
</body>
</html>
